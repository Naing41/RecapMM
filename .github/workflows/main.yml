
name: Build RecapMM Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: RecapMM-Windows/RecapMM-Windows

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RecapMM-Windows/RecapMM-Windows/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Get-ChildItem -Recurse ffmpeg_tmp -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg

      - name: Test application
        shell: pwsh
        run: |
          $env:PATH = "$PWD\ffmpeg;$env:PATH"
          python run.py --selftest

      - name: Build RecapMM.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name RecapMM `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --collect-all av --collect-all edge_tts --collect-all certifi `
            --collect-all tokenizers --collect-all huggingface_hub `
            --exclude-module tkinter `
            --add-data "recapmm/assets;recapmm/assets" `
            run.py

          Copy-Item ffmpeg\ffmpeg.exe,ffmpeg\ffprobe.exe dist\RecapMM\
          Copy-Item README.md dist\RecapMM\
          Compress-Archive -Path dist\RecapMM -DestinationPath RecapMM-Windows.zip

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: RecapMM-Windows
          path: RecapMM-Windows/RecapMM-Windows/RecapMM-Windows.zip
          retention-days: 14
